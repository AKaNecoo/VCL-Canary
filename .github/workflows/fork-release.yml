name: VCL Canary Installer Release

on:
  push:
    branches: [beta, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.repository_id == '1449236598'
      && github.ref_type == 'branch'
      && contains(fromJSON('["main", "beta", "dev"]'), github.ref_name)
      && (github.ref_name != 'main' || github.event_name == 'workflow_dispatch')
      && !github.event.deleted
    runs-on: windows-latest
    outputs:
      channel: ${{ steps.version.outputs.channel }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      asset: ${{ steps.version.outputs.asset }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Select release channel and version
        id: version
        shell: pwsh
        run: |
          $props = [xml](Get-Content -LiteralPath Directory.Build.props -Raw)
          $base = $props.SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()
          if ($base -notmatch '^\d+\.\d+\.\d+$') {
            throw "Expected a major.minor.patch version, got '$base'."
          }

          $channel = switch ($env:GITHUB_REF_NAME) {
            'main' { 'stable' }
            'beta' { 'beta' }
            'dev' { 'alpha' }
            default { throw "Unsupported release branch '$env:GITHUB_REF_NAME'." }
          }

          $series = Get-Content -LiteralPath '.github/canary-build-series.json' -Raw | ConvertFrom-Json
          $runNumber = [int]$env:GITHUB_RUN_NUMBER
          $build = $runNumber - [int]$series.firstRun + 1
          if ($series.upstreamVersion -ne $base -or $series.firstRun -le 0 -or $build -lt 1 -or $build -gt 99) {
            throw "Set the Canary build series for upstream $base before release (run $runNumber, build $build)."
          }

          $firstPatch = [int]$series.firstPatch
          if ($firstPatch -lt 101 -or ($firstPatch % 100) -ne 1) {
            throw 'The Canary patch range must start at 101, 201, 301, and so on.'
          }

          $upstream = [version]$base
          $patch = $firstPatch + $build - 1
          if ($patch -gt 65534 -or $runNumber -gt 65534) {
            throw 'The Canary version exceeds the Windows assembly version range.'
          }
          $canary = "$($upstream.Major).$($upstream.Minor).$patch"
          $version = switch ($channel) {
            'stable' { $canary }
            default { "$canary-$channel" }
          }
          $display = switch ($channel) {
            'alpha' { "$canary Alpha" }
            'beta' { "$canary Beta" }
            default { $canary }
          }
          $asset = "VRCLearnLauncher-$($version.Replace('+', '-'))-win-x64-Setup.exe"

          "channel=$channel", "version=$version", "tag=fork-v$version", "asset=$asset" >> $env:GITHUB_OUTPUT
          "BASE_VERSION=$base", "RELEASE_VERSION=$version", "DISPLAY_VERSION=$display", "RELEASE_TAG=fork-v$version",
            "CANARY_PRODUCT_VERSION=$canary", "CANARY_ASSEMBLY_VERSION=$canary.0",
            "UPSTREAM_ASSEMBLY_VERSION=$base.$runNumber", "SETUP_ASSET=$asset" >> $env:GITHUB_ENV

      - name: Prepare release notes
        shell: pwsh
        run: |
          $branch = $env:GITHUB_REF_NAME
          $notes = @'
          ## 简体中文

          VCL Canary Alpha 开发构建。从使用旧标签格式的 VCL Canary 升级时，请用本页安装包覆盖安装一次。之后可继续使用应用内更新。

          ## 日本語

          VCL Canary の Alpha 開発ビルドです。旧形式のタグが付いた VCL Canary から更新する場合は、このページのインストーラーで一度上書きインストールしてください。その後はアプリ内で更新できます。

          ## English

          VCL Canary Alpha development build. If you are upgrading from a VCL Canary release that uses the old tag format, install this package over your existing installation once. You can then continue updating from within the app.
          '@
          if ($branch -ne 'dev') {
            $path = ".github/fork-release-notes/$branch.md"
            $notes = [IO.File]::ReadAllText($path).Trim()
            if ([string]::IsNullOrWhiteSpace($notes)) {
              throw "Update the release notes at $path before publishing."
            }

            $pattern = if ($branch -eq 'main') {
              '^fork-v\d+\.\d+\.\d+(?:\+build\.[1-9]\d*)?$'
            } else {
              '^fork-v\d+\.\d+\.\d+-beta(?:\.[1-9]\d*)?$'
            }
            $tags = git for-each-ref --merged=HEAD --sort=-version:refname --format='%(refname:short)' 'refs/tags/fork-v*'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $previous = $tags | Where-Object { $_ -cmatch $pattern -and $_ -ne $env:RELEASE_TAG } | Select-Object -First 1
            if ($previous) {
              $changed = git diff --name-only $previous HEAD -- $path
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              if (!$changed) {
                throw "Update $path since $previous before publishing."
              }
            }
          }

          $repo = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY"
          $run = "$repo/actions/runs/$env:GITHUB_RUN_ID"
          $commit = "$repo/commit/$env:GITHUB_SHA"
          $output = @($notes, '', '---', '',
            "基于上游 $env:BASE_VERSION。[构建记录]($run)", '',
            "アップストリーム $env:BASE_VERSION ベース。[ビルド履歴]($run)", '',
            "Based on upstream $env:BASE_VERSION. [Build log]($run)", '',
            "Commit: [$env:GITHUB_SHA]($commit)") -join [char]10
          New-Item -ItemType Directory -Path 'artifacts/releases' -Force | Out-Null
          [IO.File]::WriteAllText('artifacts/releases/release-notes.md', $output + [char]10)

      - name: Publish Windows x64 application
        shell: pwsh
        run: |
          dotnet restore src/VRCLearn.App/VRCLearn.App.csproj -r win-x64 --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet publish src/VRCLearn.App/VRCLearn.App.csproj -c Release -r win-x64 --no-restore `
            --self-contained true "-p:Version=$env:RELEASE_VERSION" -p:VclForkBuild=true "-p:VclForkCommit=$env:GITHUB_SHA" `
            "-p:VclCanaryAssemblyVersion=$env:CANARY_ASSEMBLY_VERSION" "-p:VclCanaryUpstreamAssemblyVersion=$env:UPSTREAM_ASSEMBLY_VERSION" `
            "-p:VclCanaryProductVersion=$env:CANARY_PRODUCT_VERSION" "-p:VclCanaryDisplayVersion=$env:DISPLAY_VERSION" `
            -p:DebugType=none -p:DebugSymbols=false -o artifacts/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify published versions
        shell: pwsh
        run: |
          $launcher = (Resolve-Path 'artifacts/publish/VRCLearnLauncher.dll').Path
          $assembly = [Reflection.AssemblyName]::GetAssemblyName($launcher)
          $file = [Diagnostics.FileVersionInfo]::GetVersionInfo($launcher)
          if ($assembly.Version.ToString() -ne $env:CANARY_ASSEMBLY_VERSION -or
              $file.ProductVersion -ne $env:CANARY_PRODUCT_VERSION -or
              $file.FileVersion -ne $env:CANARY_PRODUCT_VERSION) {
            throw "Unexpected launcher versions: assembly $($assembly.Version), product $($file.ProductVersion), file $($file.FileVersion)."
          }

      - name: Publish update helper when present
        if: hashFiles('src/VRCLearn.UpdateHelper/VRCLearn.UpdateHelper.csproj') != ''
        shell: pwsh
        run: |
          $project = 'src/VRCLearn.UpdateHelper/VRCLearn.UpdateHelper.csproj'
          dotnet publish $project -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:PublishTrimmed=true -p:DebugType=none `
            --source https://api.nuget.org/v3/index.json -o artifacts/update-helper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Copy-Item -LiteralPath 'artifacts/update-helper/VRCLearn.UpdateHelper.exe' -Destination 'artifacts/publish'

      - name: Verify licenses are included
        shell: pwsh
        run: |
          foreach ($name in @('LICENSE', 'THIRD-PARTY-NOTICES.txt')) {
            $source = (Get-FileHash -LiteralPath $name).Hash
            $published = (Get-FileHash -LiteralPath "artifacts/publish/$name").Hash
            if (!$published -or $published -ne $source) {
              throw "Published license file '$name' is missing or different."
            }
          }

      - name: Build installer and checksum
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path -LiteralPath $iscc)) {
            $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          }
          $name = [IO.Path]::GetFileNameWithoutExtension($env:SETUP_ASSET)
          & $iscc "/DMyAppVersion=$env:CANARY_PRODUCT_VERSION" "/DMyAppFileVersion=$env:CANARY_ASSEMBLY_VERSION" `
            "/F$name" build/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $exe = Join-Path 'artifacts/releases' $env:SETUP_ASSET
          $setupVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path -LiteralPath $exe).Path)
          if (([string]$setupVersion.ProductVersion).TrimEnd() -ne $env:CANARY_PRODUCT_VERSION) {
            throw "Unexpected installer product version: $($setupVersion.ProductVersion)."
          }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$exe.sha256", "$hash  $env:SETUP_ASSET" + [char]10)

      - name: Upload installer, checksum and release notes
        uses: actions/upload-artifact@v4
        with:
          name: win-x64-installer
          path: |
            artifacts/releases/${{ steps.version.outputs.asset }}
            artifacts/releases/${{ steps.version.outputs.asset }}.sha256
            artifacts/releases/release-notes.md
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: vcl-canary-publish
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_CHANNEL: ${{ needs.build.outputs.channel }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      SETUP_ASSET: ${{ needs.build.outputs.asset }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: win-x64-installer
          path: release-assets

      - name: Verify installer checksum
        working-directory: release-assets
        run: sha256sum -c "$SETUP_ASSET.sha256"

      - name: Verify upgrade paths from published channels
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GH_REPO
          $version = [version]($env:RELEASE_VERSION -replace '-.*$')
          $tags = gh api --paginate "repos/$repo/releases?per_page=100" --jq '.[] | select(.draft == false) | .tag_name'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Old-format clients use the documented one-time manual upgrade.
          $latest = @{}
          foreach ($tag in $tags) {
            if ($tag -ceq $env:RELEASE_TAG -or $tag -cnotmatch '^fork-v(\d+\.\d+\.\d+)(?:-(alpha|beta))?$') {
              continue
            }

            $channel = $Matches[2] ?? 'stable'
            $previous = [version]$Matches[1]
            if (!$latest.ContainsKey($channel) -or $previous -gt $latest[$channel].Version) {
              $latest[$channel] = @{ Tag = $tag; Version = $previous }
            }
          }

          foreach ($release in $latest.Values) {
            if ($version -le $release.Version) {
              throw "Version $version must be newer than published release $($release.Tag)."
            }

            $comparison = gh api "repos/$repo/compare/$($release.Tag)...$($env:GITHUB_SHA)?per_page=1" --jq .status
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($comparison -cnotin @('ahead', 'identical')) {
              throw "$($env:RELEASE_TAG) does not contain $($release.Tag). Merge the published release into the candidate before publishing."
            }
            Write-Host "Verified upgrade from $($release.Tag) ($comparison)."
          }

      - name: Publish GitHub Release
        shell: pwsh
        working-directory: release-assets
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $repo = $env:GH_REPO
          $asset = $env:SETUP_ASSET
          $checksum = "$asset.sha256"
          $preview = $env:RELEASE_CHANNEL -ne 'stable'
          $tagRef = "repos/$repo/git/ref/tags/$([Uri]::EscapeDataString($tag))"

          $tagSha = gh api $tagRef --jq .object.sha 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh api --method POST "repos/$repo/git/refs" -f "ref=refs/tags/$tag" -f "sha=$env:GITHUB_SHA" | Out-Null
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $tagSha = gh api $tagRef --jq .object.sha
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ($tagSha -ne $env:GITHUB_SHA) {
            throw "Tag '$tag' points to '$tagSha', expected '$env:GITHUB_SHA'."
          }

          $fields = 'isDraft,isPrerelease,assets,url'
          $existing = gh release view $tag --json $fields 2>$null
          if ($LASTEXITCODE -ne 0) {
            $flags = @()
            if ($preview) { $flags += '--prerelease' }
            $title = "VCL Canary $env:RELEASE_VERSION"
            gh release create $tag $asset $checksum --draft --verify-tag --latest=false `
              --title $title --notes-file release-notes.md @flags
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } elseif (($existing | ConvertFrom-Json).isDraft) {
            gh release upload $tag $asset $checksum --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          $releaseJson = gh release view $tag --json $fields
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = $releaseJson | ConvertFrom-Json
          $names = @($release.assets | ForEach-Object { $_.name })
          if ($release.isPrerelease -ne $preview -or $asset -notin $names -or $checksum -notin $names) {
            throw "Release '$tag' has the wrong channel or is missing its installer or checksum."
          }

          if ($release.isDraft) {
            gh release edit $tag --draft=false --latest=false
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (!$preview) {
            $mainSha = gh api "repos/$repo/git/ref/heads/main" --jq .object.sha
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($mainSha -eq $env:GITHUB_SHA) {
              gh release edit $tag --latest
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

          "### $env:RELEASE_CHANNEL installer", "", $release.url >> $env:GITHUB_STEP_SUMMARY
